<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
    <title>ERA — нет подключения</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f6f8fb; color: #14213d;
             font: 16px/1.5 "Segoe UI", system-ui, sans-serif; }
      .card { max-width: 420px; padding: 40px; text-align: center; background: #fff; border-radius: 24px;
              box-shadow: 0 10px 40px rgb(20 33 61 / 8%); }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 24px; color: #5b6478; }
      button { border: 0; border-radius: 999px; padding: 12px 28px; background: #0a8fdc; color: #fff; font: inherit;
               font-weight: 600; cursor: pointer; }
      button:hover { background: #087cc0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Нет подключения к интернету</h1>
      <p>Админка работает онлайн. Проверьте интернет — программа подключится сама, как только связь появится.</p>
      <button id="retry">Повторить</button>
    </div>
    <script>
      const target = new URLSearchParams(location.search).get("url");
      const go = () => target && (location.href = target);
      document.getElementById("retry").addEventListener("click", go);
      window.addEventListener("online", go);
      setInterval(() => navigator.onLine && go(), 15000);
    </script>
  </body>
</html>
